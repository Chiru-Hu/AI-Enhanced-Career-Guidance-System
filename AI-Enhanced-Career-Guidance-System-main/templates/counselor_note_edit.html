<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Note — AI CareerWise</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(160deg,#06102a,#081336);color:#dbe8ff;min-height:100vh;}
.card-glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:16px;box-shadow:0 20px 50px rgba(2,6,23,0.55);}
.small-muted{color:rgba(219,232,255,0.72);}
</style>
</head>
<body>
<div class="container py-4" style="max-width:900px;">
  <div class="card-glass p-4">
    <h3 class="text-white mb-1">Edit Counseling Note</h3>
    <div class="small-muted mb-3">Student: {{ student_user.username }} • Note #{{ note.id }}</div>

    <form method="post">
      {% csrf_token %}

      <div class="mb-2">
        <label class="small-muted mb-1">Attempt</label>
        {{ form.attempt }}
      </div>

      <div class="row g-2">
        <div class="col-md-8">
          <label class="small-muted mb-1">Title</label>
          {{ form.title }}
        </div>
        <div class="col-md-4">
          <label class="small-muted mb-1">Rating (0-5)</label>
          {{ form.rating }}
        </div>
      </div>

      <div class="mt-2">
        <label class="small-muted mb-1">Notes</label>
        {{ form.notes }}
      </div>

      <div class="mt-2">
        <label class="small-muted mb-1">Feedback</label>
        {{ form.feedback }}
      </div>

      <div class="mt-2">
        <label class="small-muted mb-1">Next Steps</label>
        {{ form.next_steps }}
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary">Save Changes</button>
        <a class="btn btn-outline-light" href="{% url 'counselor_student_notes' student_user.id %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
