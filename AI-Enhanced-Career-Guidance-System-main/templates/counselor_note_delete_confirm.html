<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Note — AI CareerWise</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(160deg,#06102a,#081336);color:#dbe8ff;min-height:100vh;}
.card-glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:16px;box-shadow:0 20px 50px rgba(2,6,23,0.55);}
.small-muted{color:rgba(219,232,255,0.72);}
</style>
</head>
<body>
<div class="container py-4" style="max-width:700px;">
  <div class="card-glass p-4">
    <h3 class="text-white mb-2">Delete Note</h3>
    <div class="small-muted mb-3">Are you sure you want to delete this note?</div>

    <div class="small-muted"><b class="text-white">Title:</b> {{ note.title|default:"(No title)" }}</div>
    <div class="small-muted mt-2"><b class="text-white">Notes:</b> {{ note.notes|truncatechars:200 }}</div>

    <form method="post" class="mt-3">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, Delete</button>
      <a class="btn btn-outline-light" href="{% url 'counselor_student_notes' note.student.id %}">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
