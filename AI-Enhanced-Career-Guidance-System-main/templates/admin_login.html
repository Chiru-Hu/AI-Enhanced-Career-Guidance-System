<!-- templates/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — AI CareerWise</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --glass: rgba(255,255,255,0.08);
      --glass2: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.12);
      --text: #dbe8ff;
      --muted: rgba(219,232,255,0.72);
      --bg1:#06102a;
      --bg2:#081336;
    }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px 12px;
    }
    .card-glass{
      width:100%;
      max-width:520px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(2,6,23,0.55);
      backdrop-filter: blur(12px);
    }
    .brand{
      font-weight: 800;
      letter-spacing: .3px;
    }
    .small-muted{ color: var(--muted); font-size: 13px; }
    .form-control{
      background: var(--glass2);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
    }
    .form-control:focus{
      background: var(--glass2);
      color: var(--text);
      border-color: rgba(13,110,253,0.6);
      box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
    }
    .input-group-text{
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
    }
    .btn{
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card-glass p-4 p-md-5">

    <div class="d-flex align-items-center gap-2 mb-2">
      <i class="bi bi-shield-lock fs-3 text-warning"></i>
      <div>
        <div class="brand fs-4 text-white">AI CareerWise</div>
        <div class="small-muted">Admin Panel Login</div>
      </div>
    </div>

    <!-- ✅ Messages (will not duplicate fields) -->
    {% if messages %}
      <div class="mt-3">
        {% for m in messages %}
          <div class="alert alert-{{ m.tags }} mb-2">{{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- ✅ ONE FORM ONLY -->
    <form method="post" action="{% url 'admin_login' %}" class="mt-3" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label text-white">Admin Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autocomplete="username">
      </div>

      <div class="mb-3">
        <label class="form-label text-white">Admin Password</label>
        <div class="input-group">
          <input id="pw" type="password" name="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
          <button class="btn btn-outline-light" type="button" id="togglePw" title="Show/Hide">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>

      <div class="small-muted mt-3">
        Note: Admin credentials are configured in <b>views.py</b>.
      </div>
    </form>

  </div>

  <script>
    const btn = document.getElementById("togglePw");
    const pw = document.getElementById("pw");
    btn.addEventListener("click", () => {
      const isPw = pw.type === "password";
      pw.type = isPw ? "text" : "password";
      btn.innerHTML = isPw ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });
  </script>

</body>
</html>
