<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Profile — AI CareerWise</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.10);--text:#dbe8ff;--muted:rgba(219,232,255,0.72);}
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(160deg,#06102a,#081336);color:var(--text);min-height:100vh;}
.navbar{background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);}
.card-glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;box-shadow:0 20px 50px rgba(2,6,23,0.55);}
.form-control, .form-select, textarea{
  background:rgba(255,255,255,0.08)!important;
  border:1px solid rgba(255,255,255,0.14)!important;
  color:#fff!important;
  border-radius:12px!important;
}
.form-control::placeholder, textarea::placeholder{color:#fff!important;opacity:.75!important;}
.small-muted{color:var(--muted);}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3 px-3">
  <a class="navbar-brand text-white fw-bold" href="#">AI CareerWise</a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <a href="{% url 'parent_dashboard' %}" class="btn btn-outline-light btn-sm"><i class="bi bi-house"></i> Dashboard</a>
    <a href="{% url 'logout' %}" class="btn btn-outline-warning btn-sm">Logout</a>
  </div>
</nav>

<div class="container py-4" style="max-width:900px;">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <div class="card-glass p-4">
    <h3 class="text-white mb-1"><i class="bi bi-person-lines-fill"></i> Parent Profile</h3>
    <div class="small-muted">Add your children student usernames to monitor progress.</div>

    <form method="post" class="mt-3">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label text-white fw-bold">Full Name</label>
          <input name="full_name" class="form-control" placeholder="Enter parent full name"
                 value="{{ parent_profile.full_name|default:'' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label text-white fw-bold">Relation</label>
          <input name="relation" class="form-control" placeholder="Father / Mother / Guardian"
                 value="{{ parent_profile.relation|default:'' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label text-white fw-bold">Email</label>
          <input name="email" class="form-control" placeholder="Enter email"
                 value="{{ parent_profile.email|default:'' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label text-white fw-bold">Phone</label>
          <input name="phone" class="form-control" placeholder="Enter phone number"
                 value="{{ parent_profile.phone|default:'' }}">
        </div>

        <div class="col-12">
          <label class="form-label text-white fw-bold">Children Usernames (comma separated)</label>
          <textarea name="children_usernames" class="form-control" rows="3"
                    placeholder="Example: student1, student2">{{ children_text|default:'' }}</textarea>
          <div class="small-muted mt-1">
            ⚠️ Enter the exact student account username created during registration.
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap mt-4">
        <button class="btn btn-primary px-4" type="submit">
          <i class="bi bi-check2-circle"></i> Save Profile
        </button>
        <a class="btn btn-outline-light px-4" href="{% url 'parent_dashboard' %}">
          <i class="bi bi-arrow-left"></i> Back
        </a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
